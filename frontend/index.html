<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── SEO & Identity ──────────────────────────────────────────────── -->
    <title>Andalusia Healthcare Portfolio Dashboard</title>
    <meta
      name="description"
      content="High-performance analytics dashboard for the Andalusia Healthcare Repository Portfolio — domain classification, matrix coverage, and clinical standards analysis."
    />
    <meta name="theme-color" content="#4A3426" />

    <!-- ── Favicon ────────────────────────────────────────────────────── -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- ── Resource Hints for FastAPI backend ─────────────────────────── -->
    <!-- Preconnects open the TCP+TLS handshake before the first API call -->
    <link rel="preconnect" href="http://localhost:8000" />
    <link rel="dns-prefetch" href="http://localhost:8000" />

    <!-- ── Google Fonts (Inter) with display=swap to prevent FOIT ─────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- ── Prevent Flash of Unstyled Content via inline critical CSS ──── -->
    <style>
      /* Minimal critical CSS to establish background before React mounts */
      :root {
        --header-bg: #4A3426;
        --row-odd: #FFFFFF;
        --row-even: #F7F1E9;
      }
      body {
        margin: 0;
        background-color: #FAF7F2;
        color: #1E140F;
        font-family: 'Inter', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      /* Root app shell — prevents layout shift when React renders */
      #root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
